name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # De build controleert de types van wat hij bundelt, maar niet die van de
      # testbestanden. Zonder deze stap kan een testfixture stilletjes uit de
      # pas lopen met het type dat ze zegt te vullen.
      - run: npm run typecheck

      - run: npm test

      # De build slaagt ook zonder deze variabelen — dan gelden de
      # standaardwaarden uit de broncode. Ze staan hier juist wél, zodat de
      # controle bewijst dat een gezette omgeving voorrang krijgt. Er wordt
      # tijdens de build geen verbinding gemaakt.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci
