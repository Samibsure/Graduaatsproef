name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # De build heeft de Supabase-variabelen nodig omdat de applicatie bewust
      # faalt wanneer ze ontbreken. Voor een buildcontrole volstaan dummywaarden;
      # er wordt tijdens de build geen verbinding gemaakt.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci
